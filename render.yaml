services:
  - type: web
    name: billix
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billix-db
          property: connectionString

databases:
  - name: billix-db
    databaseName: billix
    user: billix
    plan: free
    region: singapore
